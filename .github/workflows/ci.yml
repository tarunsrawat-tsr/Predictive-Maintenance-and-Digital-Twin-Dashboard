name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint, test, train smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,train,dashboard,simulator]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Tests (moto-mocked AWS, headless Streamlit, synthetic data)
        run: pytest -q

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false
      - run: terraform validate
        env:
          AWS_DEFAULT_REGION: ap-northeast-1

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train a model bundle for the images
        run: |
          pip install -e ".[train]"
          python ml/train.py --out artifacts/model --rounds 200 || echo "::warning::dataset download failed, building with placeholder model"
          mkdir -p artifacts/model data/cmapss && touch data/cmapss/.keep
      - uses: docker/setup-buildx-action@v3
      - name: Build scorer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/scorer/Dockerfile
          push: false
      - name: Build dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/dashboard/Dockerfile
          push: false
      - name: Build simulator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/simulator/Dockerfile
          push: false
